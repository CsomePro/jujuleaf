name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Cargo package version to publish to crates.io"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux-amd64:
    name: Release Linux AMD64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Install musl build tools
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Verify release request matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jujuleaf") | .version')"
          requested_version="${{ inputs.version }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ "${requested_version}" != "${package_version}" ]]; then
            echo "requested version ${requested_version} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi

      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --locked

      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --release --locked --target "${TARGET}"

      - name: Package Linux AMD64 archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          asset_name="jujuleaf-${GITHUB_REF_NAME}-${TARGET}"
          asset_dir="dist/${asset_name}"

          mkdir -p "${asset_dir}"
          strip "target/${TARGET}/release/jujuleaf"
          install -m 0755 "target/${TARGET}/release/jujuleaf" "${asset_dir}/jujuleaf"
          install -m 0644 README.md README.zh.md LICENSE "${asset_dir}/"
          install -d -m 0755 "${asset_dir}/assets"
          install -m 0644 assets/jujuleaf-logo.png "${asset_dir}/assets/"
          if readelf -l "${asset_dir}/jujuleaf" | grep -q INTERP; then
            echo "release binary unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi
          "${asset_dir}/jujuleaf" --version

          tar -C dist -czf "dist/${asset_name}.tar.gz" "${asset_name}"
          cd dist
          sha256sum "${asset_name}.tar.gz" > SHA256SUMS

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_name="jujuleaf-${GITHUB_REF_NAME}-${TARGET}"
          notes_file=".github/release-${GITHUB_REF_NAME}.md"
          notes_args=(--generate-notes)
          if [[ -f "${notes_file}" ]]; then
            notes_args=(--notes-file "${notes_file}")
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "dist/${asset_name}.tar.gz#Linux AMD64 static binary" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --fail-on-no-commits \
            "${notes_args[@]}" \
            --title "JujuLeaf ${GITHUB_REF_NAME}"

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
