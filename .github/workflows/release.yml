name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Cargo package version to publish to crates.io"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Verify release request matches Cargo package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jujuleaf") | .version')"
          requested_version="${{ inputs.version }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ "${requested_version}" != "${package_version}" ]]; then
            echo "requested version ${requested_version} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check

  build:
    name: Build · ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static -C link-self-contained=yes"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static -C link-self-contained=yes"
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ""
          - name: Windows AMD64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          target_env="${TARGET//-/_}"
          echo "CC_${target_env}=musl-gcc" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_${target_env^^}_LINKER=musl-gcc" >> "${GITHUB_ENV}"

      - name: Run target lint
        run: cargo clippy --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings

      - name: Run native tests
        env:
          RUSTFLAGS: ""
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static Windows CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = rustc --target "$env:TARGET" -C target-feature=+crt-static --print cfg
          if ($cfg -notcontains 'target_feature="crt-static"') {
            throw "MSVC static CRT is not enabled"
          }

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset_name="jujuleaf-${GITHUB_REF_NAME}-${TARGET}"
          asset_dir="dist/${asset_name}"

          mkdir -p "${asset_dir}/assets"
          cp "target/${TARGET}/release/jujuleaf" "${asset_dir}/jujuleaf"
          chmod 0755 "${asset_dir}/jujuleaf"
          cp README.md README.zh.md LICENSE "${asset_dir}/"
          cp assets/jujuleaf-logo.png "${asset_dir}/assets/"

          if [[ "${TARGET}" == *-linux-musl ]]; then
            if readelf -l "${asset_dir}/jujuleaf" | grep -q INTERP; then
              echo "Linux release binary unexpectedly contains a dynamic interpreter" >&2
              exit 1
            fi
          else
            non_system="$(otool -L "${asset_dir}/jujuleaf" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)' || true)"
            if [[ -n "${non_system}" ]]; then
              echo "macOS release links a non-system library:" >&2
              echo "${non_system}" >&2
              exit 1
            fi
          fi

          "${asset_dir}/jujuleaf" --version
          "${asset_dir}/jujuleaf" skill validate --raw
          tar -C dist -czf "dist/${asset_name}.tar.gz" "${asset_name}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetName = "jujuleaf-$env:GITHUB_REF_NAME-$env:TARGET"
          $assetDir = "dist\$assetName"
          New-Item -ItemType Directory -Force "$assetDir\assets" | Out-Null
          Copy-Item "target\$env:TARGET\release\jujuleaf.exe" "$assetDir\jujuleaf.exe"
          Copy-Item README.md, README.zh.md, LICENSE $assetDir
          Copy-Item assets\jujuleaf-logo.png "$assetDir\assets\"
          & "$assetDir\jujuleaf.exe" --version
          & "$assetDir\jujuleaf.exe" skill validate --raw
          Compress-Archive -Path $assetDir -DestinationPath "dist\$assetName.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file=".github/release-${GITHUB_REF_NAME}.md"
          notes_args=(--generate-notes)
          if [[ -f "${notes_file}" ]]; then
            notes_args=(--notes-file "${notes_file}")
          fi
          release_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --fail-on-no-commits \
            "${notes_args[@]}" \
            "${release_args[@]}" \
            --title "JujuLeaf ${GITHUB_REF_NAME}"

  publish:
    name: Publish crate
    if: github.event_name == 'push'
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

  publish-retry:
    name: Retry crates.io publish
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
